name: Public engineering proof integrity

on:
  push:
    branches: [main]
    paths:
      - docs/engineering-proof.md
      - scripts/verify-proof.py
      - .github/workflows/engineering-proof.yml
      - examples/static-release-gate/**
  pull_request:
    paths:
      - docs/engineering-proof.md
      - scripts/verify-proof.py
      - .github/workflows/engineering-proof.yml
      - examples/static-release-gate/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-engineering-proof
  cancel-in-progress: false

jobs:
  verify:
    name: Validate public proof statements
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout public source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run offline evidence/privacy contract
        run: python3 scripts/verify-proof.py
      - name: Run reproducible public release-gate tests
        run: python3 -m unittest discover -s examples/static-release-gate -p 'test_*.py' -v
      - name: Check whitespace and patch integrity
        run: git diff --check HEAD~1 HEAD || git diff --check
